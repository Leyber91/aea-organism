<!DOCTYPE html><html><head><meta charset="utf-8"><title>HERALD</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--panel:#0f0f11;--ink:#f1f0ec;--soft:#b9b8b3;--dim:#76757a;--faint:#3c3b40;
  --gold:#d4a24c;--gold-dim:#8a6f3a;--bad:#c96a5a;--line:rgba(241,240,236,.09)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.55 'IBM Plex Mono',Consolas,monospace;
  height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:16px;padding:12px 22px;border-bottom:1px solid var(--line)}
h1{font-weight:300;font-size:16px;letter-spacing:.18em}h1 b{color:var(--gold);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:10px;color:var(--dim);letter-spacing:.08em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
header nav{margin-left:auto;display:flex;gap:18px;font-size:10.5px;letter-spacing:.1em}
header nav a{color:var(--dim);text-decoration:none}header nav a:hover{color:var(--gold)}
main{flex:1;display:grid;grid-template-columns:minmax(420px,44%) 1fr;min-height:0}
#brainwrap{border-right:1px solid var(--line);position:relative}
#brainwrap iframe{width:100%;height:100%;border:0;background:var(--bg)}
#dialog{display:flex;flex-direction:column;min-height:0}
#msgs{flex:1;overflow-y:auto;padding:22px 26px;scroll-behavior:smooth}
.msg{max-width:88%;margin-bottom:16px;animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
.msg .who{font-size:9.5px;letter-spacing:.24em;color:var(--dim);margin-bottom:4px}
.msg.luis{margin-left:auto}.msg.luis .who{text-align:right;color:var(--gold-dim)}
.msg .body{padding:10px 14px;border:1px solid var(--line);background:var(--panel);white-space:pre-wrap;word-break:break-word}
.msg.luis .body{border-color:var(--gold-dim);background:rgba(212,162,76,.05)}
.msg.err .body{border-color:var(--bad)}
.receipt{margin-top:6px;font-size:10px;color:var(--dim)}
.receipt summary{cursor:pointer;letter-spacing:.06em;color:var(--gold-dim);list-style:none}
.receipt summary::before{content:'\25B8 ';color:var(--gold)}
.receipt[open] summary::before{content:'\25BE '}
.receipt .r-block{border-left:2px solid var(--gold-dim);padding:6px 0 6px 12px;margin-top:6px}
.receipt .r-block h4{font-size:9px;letter-spacing:.22em;color:var(--gold);margin-bottom:3px}
.receipt .r-block div{padding:1.5px 0;word-break:break-word}
#composer{border-top:1px solid var(--line);padding:14px 26px 16px}
#toggles{display:flex;gap:22px;margin-bottom:9px;font-size:10px;letter-spacing:.08em;color:var(--dim)}
#toggles label{cursor:pointer;display:flex;gap:6px;align-items:center}
#toggles input{accent-color:var(--gold)}
#row{display:flex;gap:12px}
#inp{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);
  font:inherit;padding:12px 14px;outline:none;resize:none;height:52px}
#inp:focus{border-color:var(--gold-dim)}
#send{background:var(--gold);color:#0a0a0b;border:0;font:inherit;font-weight:600;
  padding:0 26px;cursor:pointer;letter-spacing:.1em}
#send:disabled{background:var(--faint);color:var(--dim);cursor:wait}
#mic{background:var(--panel);color:var(--gold);border:1px solid var(--gold-dim);font:inherit;
  font-weight:600;padding:0 18px;cursor:pointer;letter-spacing:.1em}
#mic.listening{background:var(--bad);color:#0a0a0b;border-color:var(--bad);animation:pulse 1s infinite}
#mic:disabled{border-color:var(--faint);color:var(--faint);cursor:not-allowed}
#hint{margin-top:7px;font-size:9.5px;color:var(--faint);letter-spacing:.05em}
.sysline{font-size:10.5px;color:var(--dim);border-left:2px solid var(--gold-dim);
  padding:6px 12px;margin:0 0 16px;white-space:pre-wrap;word-break:break-word}
</style></head><body>
<header>
  <h1><b id="name">HERALD</b> · WORKSPACE</h1>
  <span class="pill"><span class="dot"></span><span id="stat">waking...</span></span>
  <nav><a href="/brain" target="_blank">BRAIN</a><a href="/room" target="_blank">CONTROL ROOM</a></nav>
</header>
<main>
  <div id="brainwrap"><iframe src="/brain"></iframe></div>
  <section id="dialog">
    <div id="msgs"></div>
    <div id="composer">
      <div id="toggles">
        <label><input type="checkbox" id="tspeak" checked> voice replies</label>
        <label><input type="checkbox" id="tlocal"> local-only (sensitive - kills browser voice too; nothing leaves this machine)</label>
        <span id="vinfo" style="margin-left:auto;color:var(--faint)"></span>
      </div>
      <div id="row">
        <button id="mic" title="hold a thought, click, speak">MIC</button>
        <textarea id="inp" placeholder="talk to it - speak with MIC - or /brief /consolidate /status" autofocus></textarea>
        <button id="send">SEND</button>
      </div>
      <div id="hint">Enter to send · MIC to speak (best in Edge: free Natural neural voices) · every reply carries its receipt</div>
    </div>
  </section>
</main>
<script>
const msgs = document.getElementById('msgs'), inp = document.getElementById('inp'),
      send = document.getElementById('send');

function el(html){ const d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function addLuis(text){
  msgs.appendChild(el(`<div class="msg luis"><div class="who">LUIS</div><div class="body">${esc(text)}</div></div>`));
  msgs.scrollTop = msgs.scrollHeight;
}
function addSys(text){
  msgs.appendChild(el(`<div class="sysline">${esc(text)}</div>`));
  msgs.scrollTop = msgs.scrollHeight;
}
function addEntity(r){
  const name = document.getElementById('name').textContent;
  const mems = (r.memories||[]).map(m=>`<div>· ${esc(m.slice(0,160))}</div>`).join('') || '<div>(none recalled)</div>';
  const evs = (r.events||[]).map(e=>`<div>${esc(e.organ)}.${esc(e.action)} ${esc((e.detail||'').slice(0,90))}</div>`).join('');
  const meta = r.ok ? `${esc(r.rod)} · ${r.latency}s · ${r.zone}` : 'no rod answered';
  msgs.appendChild(el(
    `<div class="msg ${r.ok?'':'err'}"><div class="who">${esc(name)} — ${meta}</div>`+
    `<div class="body">${esc(r.reply)}</div>`+
    `<details class="receipt"><summary>receipt — attention, energy, synapses</summary>`+
    `<div class="r-block"><h4>Attended memories (why it said this)</h4>${mems}</div>`+
    `<div class="r-block"><h4>Synapse window (what its brain did)</h4>${evs}</div>`+
    `</details></div>`));
  msgs.scrollTop = msgs.scrollHeight;
}

async function submit(){
  const text = inp.value.trim();
  if (!text) return;
  inp.value = ''; send.disabled = true;
  if (text.startsWith('/')){
    addSys('> ' + text);
    const cmd = text.slice(1).split(/\s/)[0];
    try{
      const r = await (await fetch('/do', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({cmd})})).json();
      addSys((r.ok?'':'FAILED\n') + (r.out||''));
    }catch(e){ addSys('command failed: '+e); }
    send.disabled = false; inp.focus(); return;
  }
  addLuis(text);
  const local = document.getElementById('tlocal').checked;
  const wantVoice = document.getElementById('tspeak').checked;
  try{
    const r = await (await fetch('/talk', {method:'POST', headers:{'Content-Type':'application/json'},
      // local-only: browser neural voice is cloud-assisted -> server SAPI speaks instead
      body: JSON.stringify({text, speak: wantVoice && (local || !bestVoice()),
                            zone: local ? 'local' : 'grid'})})).json();
    addEntity(r);
    if (wantVoice && !local && r.ok) sayNeural(r.reply);
  }catch(e){ addSys('exchange failed: '+e); }
  send.disabled = false; inp.focus();
}
send.onclick = submit;
inp.addEventListener('keydown', e=>{ if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); submit(); }});

// ---- VOICE OUT: the browser's neural voices (Edge = Microsoft Natural, near-human, free) ----
let _voices = [];
function loadVoices(){ _voices = speechSynthesis.getVoices();
  const v = bestVoice();
  document.getElementById('vinfo').textContent = v ? ('voice: ' + v.name.replace('Microsoft ','').slice(0,34))
    : 'no neural voice - open in EDGE for Natural voices';
}
speechSynthesis.onvoiceschanged = loadVoices; loadVoices();
function bestVoice(){
  return _voices.find(v=>/en/.test(v.lang) && /natural/i.test(v.name))       // Edge Natural = the prize
      || _voices.find(v=>/en/.test(v.lang) && /google/i.test(v.name))
      || null;
}
function sayNeural(text){
  const v = bestVoice(); if (!v) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.slice(0, 900));
  u.voice = v; u.rate = 1.02; speechSynthesis.speak(u);
}

// ---- VOICE IN: browser speech recognition (click MIC, speak; auto-sends) ----
const micBtn = document.getElementById('mic');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR){ micBtn.disabled = true; micBtn.title = 'no speech recognition in this browser'; }
let rec = null;
micBtn.onclick = ()=>{
  if (document.getElementById('tlocal').checked){ addSys('local-only mode: browser mic routes audio to the cloud - disabled. Untick local-only to speak.'); return; }
  if (rec){ rec.stop(); return; }
  rec = new SR(); rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = false;
  micBtn.classList.add('listening'); micBtn.textContent = '...';
  rec.onresult = e=>{
    const t = Array.from(e.results).map(r=>r[0].transcript).join('');
    inp.value = t;
    if (e.results[e.results.length-1].isFinal){ submit(); }
  };
  rec.onend = ()=>{ micBtn.classList.remove('listening'); micBtn.textContent = 'MIC'; rec = null; };
  rec.onerror = ev=>{ addSys('mic: ' + ev.error); };
  rec.start();
};

(async ()=>{
  try{
    const s = await (await fetch('/state')).json();
    document.getElementById('name').textContent = s.identity.name;
    document.getElementById('stat').textContent =
      `${s.memory.memories} memories · ${s.life.ticks} ticks lived · brief ${s.life.last_brief||'pending'}`;
    for (const t of (s.mind.turns||[]).slice(-4)){
      if (t.who==='luis') addLuis(t.text); else addEntity({ok:true, reply:t.text, rod:'earlier', latency:'', zone:'', memories:[], events:[]});
    }
    addSys('workspace open - the brain on the left is live; speak to it below.');
  }catch(e){ addSys('state unreachable: '+e); }
})();
</script></body></html>
