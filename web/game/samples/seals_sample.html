<!doctype html>
<!-- seals_sample.html — THE SEAL PRESS proof sheet: every mark on this page is GENERATED by
     /game/js/seals.js from window.AEA, nothing is drawn by hand.
     Governance: A11_SIGNATURE.md §3.3 (shape grammar) · 02_VISUAL_LAW.md §1/§4/§5 (two inks,
     concentric motif, corner brackets) · 04_UI_BIBLE.md §0 (type law, panel recipe).
     Reference sheets: design/concepts/B1, B2, B3 (seals) and A4 (the three states).
     Honesty law: names and proof strings are read live from /aea_elements.js; the sensed and
     hidden columns print dashes / NO SIGNAL because nothing has been earned there. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEALS — PROOF SHEET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/game/css/probe.css">
<style>
  /* sample-local layout only — all tokens come from probe.css */
  html,body{overflow:auto;height:auto}
  body{padding:34px 40px 60px}
  h1{font-size:15px;font-weight:500;letter-spacing:.36em;color:var(--warm);text-transform:uppercase}
  .sub{font-size:10px;letter-spacing:.16em;color:var(--s60);text-transform:uppercase;margin-top:6px}
  .rule{height:1px;background:var(--rule);margin:18px 0 6px}
  h2{font-size:10px;font-weight:400;letter-spacing:.2em;color:var(--s60);text-transform:uppercase;margin:30px 0 14px}
  .row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-start}
  .cellwrap{text-align:center}
  .cellwrap .cap{font-size:8px;letter-spacing:.16em;color:var(--s35);text-transform:uppercase;margin-top:4px}
  .note{font-size:9px;letter-spacing:.1em;color:var(--s35);text-transform:uppercase;margin-top:14px;line-height:1.9}
</style>
</head>
<body>
<div id="err"></div>
<h1>THE SEAL PRESS</h1>
<div class="sub">generated · 29 elements · six glyphs · one language</div>
<div class="rule"></div>

<h2>Map glyph states — hidden · sensed · known</h2>
<div class="row" id="states"></div>

<h2>Family frames</h2>
<div class="row" id="frames"></div>

<h2>Element seals — pressed from window.AEA</h2>
<div class="row" id="seals"></div>

<h2>State pass — the same element, three states</h2>
<div class="row" id="statepass"></div>

<div class="note" id="census"></div>
<div class="note">determinism check: reload — every engraving is identical.</div>

<script src="/aea_elements.js"></script>
<script src="/game/js/seals.js"></script>
<script>
(function () {
  "use strict";
  SEALS.init(null);
  function cell(html, cap) {
    return '<div class="cellwrap">' + html + '<div class="cap">' + cap + '</div></div>';
  }
  var i, j, out = "";
  for (i = 0; i < SEALS.SHAPES.length; i++) {
    for (j = 0; j < SEALS.STATES.length; j++) {
      out += cell(SEALS.state(SEALS.SHAPES[i], SEALS.STATES[j], 54),
                  SEALS.SHAPES[i].slice(0, 4) + " " + SEALS.STATES[j].slice(0, 3));
    }
  }
  document.getElementById("states").innerHTML = out;

  out = "";
  for (i = 0; i < SEALS.SHAPES.length; i++) out += cell(SEALS.frame(SEALS.SHAPES[i], 110), SEALS.SHAPES[i]);
  document.getElementById("frames").innerHTML = out;

  var all = SEALS.list();
  out = "";
  for (i = 0; i < all.length; i++) out += SEALS.seal(all[i].id, { size: 210 });
  document.getElementById("seals").innerHTML = out;

  out = "";
  for (j = 0; j < SEALS.STATES.length; j++) {
    out += SEALS.seal("seed.1", { size: 210, state: SEALS.STATES[j] });
  }
  out += SEALS.seal("verb.observe", { size: 210, live: true, readout: null });
  document.getElementById("statepass").innerHTML = out;

  /* the amber census, computed on this page — the law is checked, not asserted (02 §1) */
  function amber(str) { return (str.match(/#ffb000|#d4a24c/gi) || []).length; }
  var lo = 99, hi = 0, cold = 0, n;
  for (i = 0; i < all.length; i++) {
    n = amber(SEALS.seal(all[i].id, { size: 210 }));
    if (n < lo) lo = n; if (n > hi) hi = n;
    cold += amber(SEALS.seal(all[i].id, { size: 210, state: "hidden" })) +
            amber(SEALS.seal(all[i].id, { size: 210, state: "sensed" }));
  }
  document.getElementById("census").innerHTML =
    "amber census · " + all.length + " known seals: min " + lo + " · max " + hi +
    " amber references per seal — one contiguous accent (a lit route and its terminal)" +
    "<br>hidden + sensed seals (" + (all.length * 2) + " pressed): " + cold + " amber marks";
})();
</script>
</body>
</html>
